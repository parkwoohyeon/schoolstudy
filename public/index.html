<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sentiment Analyzer - 감정 분석기</title>
    <!-- Google Fonts: Inter (Apple 스타일의 깔끔한 서체) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 메인 헤더 섹션 -->
        <header>
            <h1>AI Sentiment Analyzer</h1>
            <p class="subtitle">입력하신 문장의 감정을 인공지능이 분석해 드립니다.</p>
        </header>

        <!-- 입력 섹션 -->
        <main>
            <div class="input-card">
                <textarea 
                    id="userInput" 
                    placeholder="분석하고 싶은 문장을 입력하세요... (최대 1000자)" 
                    maxlength="1000"
                ></textarea>
                <div class="char-count">
                    <span id="currentChar">0</span> / 1000
                </div>
                <button id="analyzeBtn" class="pill-button">감정 분석하기</button>
            </div>

            <!-- 분석 히스토리 섹션 (추가됨) -->
            <section class="history-section">
                <div class="section-header">
                    <h2>최근 분석 기록</h2>
                    <button id="refreshHistory" class="text-button">새로고침</button>
                </div>
                <div id="historyList" class="history-list">
                    <!-- 자바스크립트로 항목이 채워집니다 -->
                    <p class="empty-msg">기록을 불러오는 중...</p>
                </div>
            </section>
        </main>

        <!-- 푸터 -->
        <footer>
            <p>&copy; 2024 AI Sentiment Analyzer. Built with OpenAI.</p>
        </footer>
    </div>

    <!-- 로딩 오버레이 (분석 중일 때 표시) -->
    <div id="loadingOverlay" class="overlay hidden">
        <div class="loader-container">
            <div class="loader"></div>
            <p>AI가 문장을 분석하고 있습니다...</p>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="resultModal" class="overlay hidden">
        <div class="modal-content">
            <h2>분석 결과</h2>
            <div class="result-body">
                <div class="sentiment-badge" id="sentimentResult">--</div>
                <div class="confidence-container">
                    <p>신뢰도: <span id="confidenceValue">0</span>%</p>
                    <div class="progress-bar">
                        <div id="confidenceBar" class="progress-fill"></div>
                    </div>
                </div>
                <div class="reason-container">
                    <h3>분석 이유</h3>
                    <p id="analysisReason">분석 내용을 불러오는 중입니다...</p>
                </div>
            </div>
            <button id="closeModal" class="pill-button secondary">닫기</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
